<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#080a0d"
  >

  <title>
    Ball Knowledge Admin
  </title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>


<body>

  <main class="app">

    <header class="topbar">

      <div>

        <p class="eyebrow">
          BALL KNOWLEDGE HQ
        </p>

        <h1>
          GW Admin
        </h1>

        <p class="connection">
          Payment & winner control
        </p>

      </div>

    </header>


    <!-- PASSWORD -->

    <section class="payment-summary">

      <label
        class="label"
        for="password"
      >
        ADMIN PASSWORD
      </label>

      <input
        id="password"
        class="admin-input"
        type="password"
        autocomplete="current-password"
        placeholder="Enter password"
      >

    </section>


    <!-- SUMMARY -->

    <section class="payment-summary">

      <div class="summary-top">

        <div>

          <span class="label">
            GAMEWEEK
          </span>

          <strong>
            GW
            <span id="adminGw">
              —
            </span>
          </strong>

        </div>


        <button
          id="reloadAdmin"
          type="button"
          class="copy-button"
        >
          REFRESH
        </button>

      </div>


      <div id="adminTotals">
        Loading…
      </div>

    </section>


    <!-- MANAGERS -->

    <section>

      <div class="section-heading">

        <div>

          <h3>
            Managers
          </h3>

          <p>
            Manage payments and Gameweek winner.
          </p>

        </div>

      </div>


      <div
        id="adminList"
        class="manager-list"
      >

        <div class="empty">
          Loading…
        </div>

      </div>

    </section>


    <footer class="last-updated">

      <a
        href="/"
        class="back-link"
      >
        ← Public Dashboard
      </a>

    </footer>

  </main>


  <script src="/admin.js"></script>

</body>

</html>
