<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#080a0d"
  >

  <title>
    Ball Knowledge Admin
  </title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>

<body>

  <main class="app">

    <header class="topbar">

      <div>

        <p class="eyebrow">
          BALL KNOWLEDGE HQ
        </p>

        <h1>
          Admin
        </h1>

        <p
          id="adminSubtitle"
          class="connection"
        >
          Loading…
        </p>

      </div>

      <a
        href="/"
        class="small-link-button"
      >
        VIEW SITE
      </a>

    </header>


    <!-- PASSWORD -->

    <section class="admin-login-card">

      <label
        class="form-label"
        for="password"
      >
        ADMIN PASSWORD
      </label>

      <input
        id="password"
        class="form-input"
        type="password"
        autocomplete="current-password"
        placeholder="Enter password"
      >

    </section>


    <!-- GAMEWEEK SELECT -->

    <section class="admin-controls-card">

      <label
        class="form-label"
        for="gameweekSelect"
      >
        GAMEWEEK TO EDIT
      </label>

      <select
        id="gameweekSelect"
        class="form-input"
      ></select>

      <p class="admin-helper">
        Changes below are NOT saved until you press Save Changes.
      </p>

    </section>


    <div
      id="adminMessage"
      class="admin-message"
    ></div>


    <!-- GW SUMMARY -->

    <section class="admin-edit-card">

      <div class="admin-edit-header">

        <div>

          <span class="label">
            EDITING
          </span>

          <h2>
            GW
            <span id="editingGw">
              —
            </span>
          </h2>

        </div>

        <div class="admin-count">

          <strong id="draftPaidCount">
            —
          </strong>

          <small>
            PAID
          </small>

        </div>

      </div>


      <!-- WINNER -->

      <div class="winner-select-section">

        <label
          class="form-label"
          for="winnerSelect"
        >
          GAMEWEEK WINNER
        </label>

        <select
          id="winnerSelect"
          class="form-input"
        >

          <option value="">
            No winner selected
          </option>

        </select>

      </div>


      <!-- MANAGERS -->

      <div
        id="adminManagerList"
        class="admin-manager-list"
      >

        <div class="empty">
          Loading managers…
        </div>

      </div>


      <!-- SAVE BAR -->

      <div class="admin-save-area">

        <button
          id="resetChanges"
          type="button"
          class="secondary-button"
        >
          Undo Changes
        </button>

        <button
          id="saveChanges"
          type="button"
          class="primary-button"
        >
          Save Changes
        </button>

      </div>

    </section>


    <!-- QUICK STATUS -->

    <section class="admin-history-section">

      <h3>
        All Gameweeks
      </h3>

      <p>
        Quickly see which weeks still have unpaid players.
      </p>

      <div
        id="adminGwHistory"
        class="admin-gw-history"
      ></div>

    </section>


    <footer class="last-updated">

      <span id="lastUpdated">
        —
      </span>

    </footer>

  </main>


  <script src="/admin.js"></script>

</body>

</html>
